name: setup-check

# Runs setup/check.py with the team's CI key on Linux, macOS and Windows.
# Start it by hand from the Actions tab, or it runs when setup/ changes.
on:
  workflow_dispatch:
  push:
    paths: ["setup/**", ".github/workflows/setup-check.yml"]
  schedule:
    - cron: "30 8 20 10 *"   # Tue 2026-10-20 10:30 CEST, after the documents go online

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check gateway and document API
        working-directory: setup
        env:
          GATEWAY_KEY: ${{ secrets.CI_GATEWAY_KEY }}
          PYTHONUTF8: "1"
        run: uv run check.py
