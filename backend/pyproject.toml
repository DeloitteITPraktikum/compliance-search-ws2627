[project]
name = "compliance-search"
version = "0.1.0"
description = "Sync, processing, retrieval and the POST /ask API for the compliance search"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.4",
    "pydantic>=2.14.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
